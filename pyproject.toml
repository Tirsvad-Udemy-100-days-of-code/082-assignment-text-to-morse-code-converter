[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-converter"
version = "0.1.0"
description = "Day 82 of Udemy's 100 Days of Code: a text-based Python program that converts text into Morse code."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
dependencies = []

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/082-assignment-text-to-morse-code-converter"
Documentation = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/082-assignment-text-to-morse-code-converter/wiki"
"Issue tracker" = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/082-assignment-text-to-morse-code-converter/issues"

[project.scripts]
morse-converter = "morse_converter.presentation.commands.convert_text_command:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbclient>=0.10",
    "nbformat>=5",
    "ipykernel>=6",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
